name: Proxy reliability

on:
  pull_request:
    paths:
      - 'src/proxima_traffic/proxies.py'
      - 'src/proxima_traffic/accounts.py'
      - 'src/proxima_traffic/proxy_feed.py'
      - 'src/proxima_traffic/config.py'
      - 'src/proxima_traffic/bot_main.py'
      - 'src/proxima_traffic/bot/handlers.py'
      - 'src/proxima_traffic/bot/keyboards.py'
      - 'tests/test_proxy_*.py'
      - 'tests/conftest.py'
      - 'pyproject.toml'
      - '.github/workflows/proxy-quality.yml'
  workflow_dispatch:

jobs:
  proxy-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -e '.[dev]'
      - name: Lint changed proxy components
        run: >
          ruff check
          src/proxima_traffic/proxies.py
          src/proxima_traffic/accounts.py
          src/proxima_traffic/proxy_feed.py
          src/proxima_traffic/config.py
          src/proxima_traffic/bot_main.py
          src/proxima_traffic/bot/handlers.py
          src/proxima_traffic/bot/keyboards.py
          tests/conftest.py
          tests/test_proxy_reliability.py
          tests/test_proxy_management.py
      - name: Run offline proxy regressions (model-only database schema)
        env:
          PROXIMA_PROXY_MODEL_SCHEMA_ONLY: '1'
        run: >
          pytest -q tests/test_proxy_management.py
          tests/test_proxy_paste.py
          tests/test_proxy_reliability.py
      - name: Related Telegram gateway transport safety checks
        run: |
          pytest -q tests/test_telegram_safety.py \
            -k "required_proxy_outage_is_retryable or cached_client_rechecks_its_proxy_before_reuse_when_due or client_connect_rpc_failure_is_normalized_and_client_is_closed"
